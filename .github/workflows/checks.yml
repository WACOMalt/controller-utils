name: Checks

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ make pkg-config libegl1-mesa-dev libgl1-mesa-dev libegl-mesa0 libgl1-mesa-dri \
            libjson-c-dev libssl-dev libcairo2-dev libfontconfig1-dev libcurl4-openssl-dev libboost-dev libsystemd-dev \
            fonts-noto-core nodejs desktop-file-utils
          python -m pip install --requirement requirements-dev.txt
      - name: Check formatting and lint
        run: make check-format
      - name: Build
        run: make -j2 all build/frame-legacy-launcher build/frame-legacy-cleanup
      - name: Test
        run: make check
      - name: Check native memory and undefined behavior
        run: make -j2 check-sanitize

  privileged-updates:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ make pkg-config libegl1-mesa-dev libgl1-mesa-dev libjson-c-dev libssl-dev \
            libcairo2-dev libfontconfig1-dev libcurl4-openssl-dev libboost-dev libsystemd-dev python3
      - name: Check Frame installation and signed updates
        run: |
          python3 tools/frame_sdk.py build/frame-sdk
          make -j4 frame-optical build/frame-legacy-launcher build/frame-legacy-cleanup CPPFLAGS=-Ibuild/frame-sdk
          if ./build/frame-legacy-cleanup --repair-status; then
            echo 'Legacy migration accepted an unprivileged caller.'
            exit 1
          fi
          python3 -m unittest discover -s tests -p 'test_stage_frame.py'
          python3 -m unittest discover -s tests -p 'test_frame_update.py'
          for channel in stable beta; do
            name="controller-utils-frame-$channel"
            python3 tools/stage_frame.py --channel "$channel" \
              --output "build/$name" --archive "build/$name-linuxarm64.tar.gz"
          done
      - name: Save Frame test packages and migration binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controller-utils-frame-test-${{ github.sha }}
          path: |
            build/controller-utils-frame-*-linuxarm64.tar.gz
            build/frame-legacy-launcher
            build/frame-legacy-cleanup
          if-no-files-found: error
          retention-days: 7
