name: Checks

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ make pkg-config libegl1-mesa-dev libgl1-mesa-dev libegl-mesa0 libgl1-mesa-dri \
            libjson-c-dev libssl-dev libcairo2-dev libfontconfig1-dev libcurl4-openssl-dev libboost-dev libsystemd-dev \
            fonts-noto-core nodejs desktop-file-utils
          python -m pip install --requirement requirements-dev.txt
      - name: Check formatting and lint
        run: make check-format
      - name: Build
        run: make -j2 all
      - name: Test
        run: make check
      - name: Check native memory and undefined behavior
        run: make -j2 check-sanitize
