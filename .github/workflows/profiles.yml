name: Compatibility profiles

on:
  workflow_dispatch:
    inputs:
      sequence:
        description: Monotonically increasing profile sequence
        required: true
        type: string
      valid_days:
        description: Profile validity in days, between 1 and 90
        required: true
        default: '30'
        type: string

permissions:
  contents: read

concurrency:
  group: controller-utils-compatibility
  cancel-in-progress: false

jobs:
  profile:
    if: github.repository == 'kallupx/controller-utils' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build the native profile verifier
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ make pkg-config libjson-c-dev libssl-dev libcurl4-openssl-dev libarchive-dev libunwind-dev libsystemd-dev
          make -j4 build/release_check
      - name: Verify the previous signed sequence
        run: |
          status=$(curl --silent --show-error --proto '=https' --connect-timeout 5 --max-time 30 \
            --max-filesize 65536 --output build/profile-release.json --write-out '%{http_code}' \
            https://api.github.com/repos/kallupx/controller-utils/releases/tags/compatibility-profiles-v2)
          case "$status" in
            200)
              asset=$(./build/release_check --profile-asset build/profile-release.json)
              curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
                --connect-timeout 5 --max-time 30 --max-filesize 16448 \
                --output build/previous-profile.bin \
                "https://github.com/kallupx/controller-utils/releases/download/compatibility-profiles-v2/$asset"
              ./build/release_check --profile-record-history build/previous-profile.bin assets/update-public.pem > build/previous-profile-state.txt
              ;;
            404) ;;
            *) echo "Could not verify the existing compatibility feed" >&2; exit 1 ;;
          esac
      - name: Package the reviewed profile
        env:
          PROFILE_SEQUENCE: ${{ inputs.sequence }}
          PROFILE_VALID_DAYS: ${{ inputs.valid_days }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          python - <<'PY'
          import json, os, re, sys, time
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from package_profile import build
          sequence_text, days_text = os.environ['PROFILE_SEQUENCE'], os.environ['PROFILE_VALID_DAYS']
          if not re.fullmatch(r'[0-9]{1,19}', sequence_text) or not re.fullmatch(r'[0-9]{1,2}', days_text):
              raise ValueError('Invalid profile sequence or validity')
          sequence, days = int(sequence_text), int(days_text)
          previous = Path('build/previous-profile-state.txt')
          minimum = int(previous.read_text()) if previous.exists() else 0
          if not minimum < sequence <= 2**63 - 1 or not 1 <= days <= 90:
              raise ValueError('Use a newer sequence and validity between 1 and 90 days')
          key = Path(os.environ['RUNNER_TEMP']) / 'controller-utils-profile.pem'
          created = False
          try:
              with key.open('x', opener=lambda path, flags: os.open(path, flags, 0o600)) as output:
                  created = True
                  output.write(os.environ['RELEASE_SIGNING_KEY'])
              result = build(Path('compatibility/queue-v2.json'), sequence, int(time.time()) + days * 86400,
                             key, Path('assets/update-public.pem'), Path('dist'))
              print(json.dumps(result))
          finally:
              if created:
                  key.unlink(missing_ok=True)
          PY
      - name: Publish the compatibility prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view compatibility-profiles-v2 --json isPrerelease --jq '.isPrerelease' > build/profile-prerelease.txt
          then
            test "$(cat build/profile-prerelease.txt)" = true
          else
            gh release create compatibility-profiles-v2 --target "$GITHUB_SHA" --draft --prerelease --latest=false --title "Controller Utils compatibility profiles" --notes "Signed compatibility data for supported Controller Utils validators."
          fi
          gh release upload compatibility-profiles-v2 dist/compatibility-profile-*.bin
          gh release edit compatibility-profiles-v2 --draft=false --prerelease --latest=false
          gh api "repos/$GH_REPO/releases/tags/compatibility-profiles-v2" > build/published-profiles.json
          python - <<'PY'
          import json, re, subprocess, os
          release = json.load(open('build/published-profiles.json'))
          assets = []
          for asset in release['assets']:
              match = re.fullmatch(r'compatibility-profile-([1-9][0-9]*)\.bin', asset['name'])
              if match and asset['state'] == 'uploaded' and type(asset['id']) is int and asset['id'] > 0:
                  assets.append((int(match[1]), asset['id']))
          for sequence, identity in sorted(assets, reverse=True)[3:]:
              subprocess.run(['gh', 'api', '--method', 'DELETE',
                              f"repos/{os.environ['GH_REPO']}/releases/assets/{identity}"], check=True)
          PY
