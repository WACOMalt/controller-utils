name: Publish Frame release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: controller-utils-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'kallupx/controller-utils'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ make pkg-config libegl1-mesa-dev libgl1-mesa-dev libjson-c-dev libssl-dev \
            libcairo2-dev libfontconfig1-dev libcurl4-openssl-dev libboost-dev libsystemd-dev python3
      - name: Verify tag and build both channels
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          test "$RELEASE_TAG" = "v$version"
          python3 tools/frame_sdk.py build/frame-sdk
          make -j4 frame-optical build/optical_session_test build/tracked_input_test CPPFLAGS=-Ibuild/frame-sdk
          ./build/optical_session_test
          ./build/tracked_input_test
          python3 -m unittest discover -s tests -p 'test_stage_frame.py'
          python3 -m unittest discover -s tests -p 'test_frame_update.py'
          mkdir dist
          for channel in stable beta; do
            name="controller-utils-frame-$channel-$version"
            python3 tools/stage_frame.py --channel "$channel" \
              --output "build/$name" --archive "dist/$name-linuxarm64.tar.gz"
          done
      - name: Sign Frame packages
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          key=$(mktemp "$RUNNER_TEMP/controller-utils-signing-XXXXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          for channel in stable beta; do
            python3 tools/sign_frame_release.py --channel "$channel" --key "$key" dist/controller-utils-frame-"$channel"-*.tar.gz
          done
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            test "$draft" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --latest=false --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
