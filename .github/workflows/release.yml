name: Frame packages

on:
  workflow_dispatch:
    inputs:
      channel:
        description: SteamOS channel for the package
        type: choice
        required: true
        options:
          - stable
          - beta
      build_id:
        description: SteamOS build ID override for the selected channel
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ make pkg-config libegl1-mesa-dev libgl1-mesa-dev libjson-c-dev libssl-dev \
            libcairo2-dev libfontconfig1-dev libcurl4-openssl-dev \
            libboost-dev libsystemd-dev python3
      - name: Build and verify the selected package
        env:
          FRAME_CHANNEL: ${{ inputs.channel }}
          FRAME_BUILD: ${{ inputs.build_id }}
        run: |
          python3 tools/frame_sdk.py build/frame-sdk
          make -j4 frame-optical build/optical_session_test build/tracked_input_test CPPFLAGS=-Ibuild/frame-sdk
          ./build/optical_session_test
          ./build/tracked_input_test
          python3 -m unittest discover -s tests -p 'test_stage_frame.py'
          name="controller-utils-frame-$FRAME_CHANNEL"
          args=()
          if test -n "${FRAME_BUILD:-}"; then args+=(--build-id "$FRAME_BUILD"); fi
          python3 tools/stage_frame.py --channel "$FRAME_CHANNEL" \
            --output "build/$name" --archive "build/$name-linuxarm64.tar.gz" "${args[@]}"
      - name: Upload the selected channel package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controller-utils-frame-${{ inputs.channel }}-${{ github.sha }}
          path: build/controller-utils-frame-${{ inputs.channel }}-linuxarm64.tar.gz
          if-no-files-found: error
